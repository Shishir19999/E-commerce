server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback for react-router routes
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
